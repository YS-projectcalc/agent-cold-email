name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: install, typecheck, build, test (CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No `cache: npm`: this repo has no lockfile.

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck -w packages/cli

      - name: Build
        run: npm run build -w packages/cli

      - name: Test
        run: npm test -w packages/cli
